        function App() {
            const [activeTab, setActiveTab] = useState('library');
            const [lang, setLang] = useState('ru'); // ru / en
            
            // Library states
            const [selectedCategory, setSelectedCategory] = useState('DRUMS');
            const [selectedInstrument, setSelectedInstrument] = useState(INSTRUMENTS_DATABASE['DRUMS'][0]);
            
            // Calculator states
            const [calcInstrument, setCalcInstrument] = useState('Kick');
            const [calcProblem, setCalcProblem] = useState('Muddy');
            const [calcContext, setCalcContext] = useState('Live');
            const [eqType, setEqType] = useState('Bell');
            const [eqFreq, setEqFreq] = useState(250);
            const [eqGain, setEqGain] = useState(-3);
            const [eqQ, setEqQ] = useState(2.5);

            // Training quiz states
            const [quizStarted, setQuizStarted] = useState(false);
            const [targetFreq, setTargetFreq] = useState(1000);
            const [userGuessFreq, setUserGuessFreq] = useState(1000);
            const [quizScore, setQuizScore] = useState(0);
            const [quizRound, setQuizRound] = useState(1);
            const [quizFeedback, setQuizFeedback] = useState(null);

            // Audio Context for Ear Training
            const playTestTone = (freq) => {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 1);
                } catch(e) {
                    console.log('Audio Context not supported or blocked', e);
                }
            };

            const startNewQuizRound = () => {
                const freqs = [125, 250, 500, 1000, 2000, 4000, 8000];
                const randomFreq = freqs[Math.floor(Math.random() * freqs.length)];
                setTargetFreq(randomFreq);
                setUserGuessFreq(1000);
                setQuizFeedback(null);
                playTestTone(randomFreq);
            };

            const submitQuizGuess = () => {
                const diff = Math.abs(userGuessFreq - targetFreq);
