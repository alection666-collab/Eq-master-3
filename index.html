<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>EQ-IQ</title><meta name="theme-color" content="#1b1d20"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EQ-IQ"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=IBM+Plex+Sans+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1d20;--pn:#25282c;--ln:#363a40;--tx:#e8eaec;--mu:#9aa1a9;--te:#2dd4bf;--or:#ff8a3d;--gr:#7ddc6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Manrope,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--ln);z-index:9}
.logo{font:700 22px 'IBM Plex Sans Condensed',sans-serif;padding:10px 16px 0;letter-spacing:.5px}.logo b{color:#9bff2a}.pill{margin-left:8px;font:700 12px 'IBM Plex Sans Condensed',sans-serif;padding:1px 8px;border:1px solid var(--mu);border-radius:8px;color:var(--mu);vertical-align:middle}.pill.pr{color:#9bff2a;border-color:#9bff2a}.logo i{color:var(--or);font-style:normal}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
nav a{flex:none;padding:7px 12px;border-radius:6px;color:var(--mu);text-decoration:none;font:500 14px 'IBM Plex Sans Condensed',sans-serif;border:1px solid transparent}
nav a.on{color:var(--bg);background:var(--te)}nav a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--or);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:16px}
h1{font:700 26px 'IBM Plex Sans Condensed',sans-serif;margin:4px 0 6px}h2{font:700 18px 'IBM Plex Sans Condensed',sans-serif;margin:22px 0 8px;color:var(--te)}h3{margin:0 0 4px;font-size:15px}
p{margin:6px 0}.mu{color:var(--mu)}.warn{border-left:3px solid var(--or);padding:8px 12px;background:#2b2621;border-radius:0 6px 6px 0;margin:12px 0;font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:var(--te)}.card small{color:var(--mu)}.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#1f3a36;color:var(--te);margin:2px 4px 2px 0}.tag.o{background:#43301f;color:var(--or)}.tag.g{background:#26391f;color:var(--gr)}
input,select,button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:9px 11px}
input{width:100%}button{cursor:pointer;background:#1f3a36;border-color:var(--te)}button.o{background:#43301f;border-color:var(--or)}button.s{background:var(--pn);border-color:var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.row>*{flex:1 1 150px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0;scrollbar-width:none}.chips button{flex:none;padding:6px 12px;background:var(--pn);border-color:var(--ln)}.chips button.on{background:var(--te);color:var(--bg);border-color:var(--te)}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-weight:600}td.f{font:500 14px 'IBM Plex Sans Condensed',sans-serif;color:var(--or);white-space:nowrap}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--pn)}tr.dt td{background:#212428;font-size:13px}
details{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:8px 0}summary{cursor:pointer;font-weight:600}
canvas{width:100%;height:auto;background:#17191b;border:1px solid var(--ln);border-radius:8px;display:block}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.kv div{background:var(--pn);border-radius:6px;padding:8px 10px}.kv span{display:block;color:var(--mu);font-size:12.5px}
.out{background:var(--pn);border:1px solid var(--te);border-radius:8px;padding:12px;margin-top:10px}.ok{color:var(--gr)}.bad{color:var(--or)}
</style></head><body>
